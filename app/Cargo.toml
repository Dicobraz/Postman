[package]
name = "postman"
description = "Корпоративный JMAP-клиент: почта, календарь, контакты"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
postman-ir.workspace = true
postman-jmap.workspace = true
postman-cache.workspace = true
postman-worker.workspace = true
postman-compose.workspace = true
postman-search.workspace = true
postman-demo.workspace = true
postman-core.workspace = true
postman-calendar.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "system_fonts", "links", "clipboard", "x11", "wayland"] }
jiff = "0.2"
rfd = "0.17"
