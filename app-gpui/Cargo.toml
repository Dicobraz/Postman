[package]
name = "postman-gpui"
description = "Спайк UI на gpui (сравнение с egui по одному сценарию)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
postman-ir.workspace = true
postman-cache.workspace = true
postman-worker.workspace = true
postman-demo.workspace = true
postman-calendar.workspace = true
gpui-kit = "0.7"
jiff = "0.2"
postman-core.workspace = true
pets-commands = { git = "https://github.com/Dicobraz/pets", rev = "d79c3ad2b8a44ece7ed9e323b8245d1ef0a3885a" }
pets-i18n = { git = "https://github.com/Dicobraz/pets", rev = "d79c3ad2b8a44ece7ed9e323b8245d1ef0a3885a" }
pets-shell = { git = "https://github.com/Dicobraz/pets", rev = "d79c3ad2b8a44ece7ed9e323b8245d1ef0a3885a" }
pets-ui = { git = "https://github.com/Dicobraz/pets", rev = "d79c3ad2b8a44ece7ed9e323b8245d1ef0a3885a" }
futures = "0.3"
tracing = "0.1"
# Снимки экранов (`--screens`, S2-05): дескриптор окна и запись PNG.
raw-window-handle = "0.6"
png = "0.17"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
