[workspace]
resolver = "3"
members = ["crates/ir", "crates/jmap", "crates/cache", "crates/compose", "crates/worker", "crates/search", "crates/demo", "crates/calendar", "crates/core", "app-gpui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
postman-ir = { path = "crates/ir" }
postman-jmap = { path = "crates/jmap" }
postman-cache = { path = "crates/cache" }
postman-compose = { path = "crates/compose" }
postman-search = { path = "crates/search" }
postman-demo = { path = "crates/demo" }
postman-calendar = { path = "crates/calendar" }
postman-core = { path = "crates/core" }
postman-worker = { path = "crates/worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Просмотр PDF в воркере (S5-07, docs/SIZE.md «Воркер»): рендер одной страницы по запросу — холодный код,
# оптимизация по размеру. Крейты только воркера (gpui их не использует), на postman.exe не влияет.
[profile.release.package.hayro]
opt-level = "s"
[profile.release.package.hayro-interpret]
opt-level = "s"
[profile.release.package.hayro-syntax]
opt-level = "s"
[profile.release.package.hayro-jbig2]
opt-level = "s"
[profile.release.package.hayro-jpeg2000]
opt-level = "s"
[profile.release.package.hayro-ccitt]
opt-level = "s"
[profile.release.package.hayro-cmap]
opt-level = "s"
[profile.release.package.hayro-postscript]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.fearless_simd]
opt-level = "s"
[profile.release.package.pic-scale]
opt-level = "s"

# «Не падать» (S2-03): вне тестов нет unwrap/expect/panic!; в тестах разрешены (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
# Патч Windows-платформы gpui (шейдеры в exe, кадры по запросу, живой ресайз) — общий для приложений Pets:
# github.com/Dicobraz/pets, crates/pets-gpui-windows.
gpui-pre-windows = { git = "https://github.com/Dicobraz/pets", rev = "7b10457a9ae7615f607de3910cdf5baec55d935d" }

# Отладочная информация только для своего кода: target/debug не раздувается до десятков ГБ.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
