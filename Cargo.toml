[workspace]
resolver = "3"
members = ["crates/ir", "crates/jmap", "crates/cache", "crates/compose", "crates/worker", "crates/search", "crates/demo", "crates/calendar", "crates/core", "app", "app-gpui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
postman-ir = { path = "crates/ir" }
postman-jmap = { path = "crates/jmap" }
postman-cache = { path = "crates/cache" }
postman-compose = { path = "crates/compose" }
postman-search = { path = "crates/search" }
postman-demo = { path = "crates/demo" }
postman-calendar = { path = "crates/calendar" }
postman-core = { path = "crates/core" }
postman-worker = { path = "crates/worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gpui 0.2.2 тянет xattr 0.2.3, несовместимый со свежим libc (нет ENOATTR на Linux).
[patch.crates-io]
xattr = { path = "third_party/xattr" }
# Шейдеры встроены в exe и компилируются при запуске: кросс-сборка из Linux без fxc.exe
# и без путей машины сборки в бинаре.
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }

# Отладочная информация только для своего кода: target/debug не раздувается до десятков ГБ.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
